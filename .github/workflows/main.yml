name: Build Critic AVG for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Test the background checker
        run: node scripts/test-runner.mjs

      - name: Prepare the app files
        run: node scripts/build-www.mjs

      - name: Create the Android project
        run: |
          rm -rf android
          npx cap add android
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} node scripts/patch-android.mjs
          npx @capacitor/assets generate --android --iconBackgroundColor '#18171C' --iconBackgroundColorDark '#18171C' --splashBackgroundColor '#202227' --splashBackgroundColorDark '#202227'
          npx cap sync android

      - name: Load the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "CRITICAVG_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build and sign
        working-directory: android
        env:
          CRITICAVG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CRITICAVG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CRITICAVG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: critic-avg-android-1.0.${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
